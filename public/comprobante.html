<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comprobante · Porra Mundial 2026</title>
<!--
  Página de RENDER del comprobante de la porra.

  Por qué existe: Supabase (Storage Y Edge Functions) fuerza Content-Type
  text/plain + CSP sandbox en respuestas HTML por política anti-phishing, así
  que un enlace directo a *.supabase.co NO renderiza (se ve como código). Esta
  página se sirve desde Vercel (dominio propio, sin esa política), hace fetch
  del HTML del comprobante a la EF `get-receipt` (que resuelve el code → archivo
  en Storage) y lo pinta en un <iframe srcdoc>.

  Es un fichero estático en public/ (Vite lo copia verbatim a dist/) → servido
  en /comprobante.html SIN necesidad de rewrites en vercel.json.
-->
<style>
  html, body { margin: 0; padding: 0; background: #eef1f5; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  #msg { padding: 48px 20px; text-align: center; color: #6b7280; font-size: 15px; line-height: 1.5; }
  #frame { border: 0; width: 100%; min-height: 100vh; display: none; background: #eef1f5; }
</style>
</head>
<body>
  <div id="msg">Cargando tu comprobante…</div>
  <iframe id="frame" title="Comprobante de tu porra" sandbox="allow-same-origin"></iframe>
  <script>
    (function () {
      // EF pública (verify_jwt=false); el code de 12 hex es la auth de facto.
      var EF = "https://cmyfyswystjgzdwbqyyb.supabase.co/functions/v1/get-receipt";
      var CODE_RE = /^[A-Fa-f0-9]{12}$/;
      var msg = document.getElementById("msg");
      var frame = document.getElementById("frame");
      var code = (new URLSearchParams(location.search).get("code") || "").trim();

      if (!CODE_RE.test(code)) {
        msg.textContent = "Enlace de comprobante inválido.";
        return;
      }

      // Ajusta la altura del iframe a su contenido (same-origin gracias a
      // allow-same-origin) para que la página tenga scroll natural en móvil.
      function sizeFrame() {
        try {
          var doc = frame.contentWindow && frame.contentWindow.document;
          var h = doc && doc.documentElement ? doc.documentElement.scrollHeight : 0;
          if (h) frame.style.minHeight = h + "px";
        } catch (e) { /* fallback: queda min-height:100vh */ }
      }

      fetch(EF + "?code=" + encodeURIComponent(code))
        .then(function (r) {
          if (!r.ok) throw new Error("http_" + r.status);
          return r.text();
        })
        .then(function (html) {
          frame.addEventListener("load", sizeFrame);
          frame.srcdoc = html;
          frame.style.display = "block";
          msg.style.display = "none";
          // Re-mide tras cargar las banderas (cambian la altura del documento).
          setTimeout(sizeFrame, 600);
          setTimeout(sizeFrame, 1800);
        })
        .catch(function () {
          msg.textContent = "No se pudo cargar el comprobante. Inténtalo de nuevo en unos minutos.";
        });
    })();
  </script>
</body>
</html>
