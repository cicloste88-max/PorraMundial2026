    <path d="M0,-55 Q-15,-95 -10,-100 Q5,-80 5,-55 Z"></path>
  </g>
  
  <path d="M-12,-100 Q-12,-115 0,-115 Q12,-115 12,-100 Q6,-105 0,-100 Q-6,-105 -12,-100 Z" fill="#D21034"></path>
  
  <rect x="-70" y="40" width="50" height="10" fill="#2a2a2a"></rect>
  <rect x="20" y="40" width="50" height="10" fill="#2a2a2a"></rect>
  
  <g fill="#1a1a1a"><circle cx="-50" cy="65" r="4"></circle><circle cx="-35" cy="65" r="4"></circle><circle cx="40" cy="65" r="4"></circle><circle cx="55" cy="65" r="4"></circle></g>
</g><rect width="1500" height="1000" fill="url(#silk)"></rect><rect width="1500" height="1000" fill="url(#shine)" style="mix-blend-mode:screen"></rect><rect width="1500" height="1000" fill="url(#folds)" style="mix-blend-mode:multiply"></rect><rect width="1500" height="1000" fill="url(#foldsV)" style="mix-blend-mode:multiply"></rect></g></g></svg>