<rect x="600" y="380" width="300" height="240" fill="#FFF"></rect>
<g transform="translate(750,500)">
  
  <ellipse cx="0" cy="60" rx="100" ry="10" fill="#3a7d2e"></ellipse>
  <path d="M0,60 L0,-50" stroke="#5C3A1E" stroke-width="6"></path>
  
  <g fill="#3F8B43">
    <path d="M0,-50 Q-50,-70 -80,-55 Q-40,-55 0,-45 Z"></path>
    <path d="M0,-50 Q50,-70 80,-55 Q40,-55 0,-45 Z"></path>
