<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000">
<title>Haiti</title><defs>
<clipPath id="flagClip"><path d="M30,80 C 250,40 500,140 750,90 C 1000,40 1250,150 1470,100 L 1480,920 C 1250,870 1000,960 750,910 C 500,860 250,960 30,920 Z"></path></clipPath>
<linearGradient id="folds" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#000" stop-opacity=".35"></stop><stop offset="6%" stop-color="#000" stop-opacity=".05"></stop><stop offset="14%" stop-color="#000" stop-opacity=".30"></stop><stop offset="22%" stop-color="#000" stop-opacity="0"></stop><stop offset="34%" stop-color="#000" stop-opacity=".18"></stop><stop offset="46%" stop-color="#000" stop-opacity="0"></stop><stop offset="58%" stop-color="#000" stop-opacity=".22"></stop><stop offset="70%" stop-color="#000" stop-opacity="0"></stop><stop offset="82%" stop-color="#000" stop-opacity=".20"></stop><stop offset="92%" stop-color="#000" stop-opacity="0"></stop><stop offset="100%" stop-color="#000" stop-opacity=".30"></stop>
</linearGradient>
<linearGradient id="foldsV" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#000" stop-opacity=".25"></stop><stop offset="15%" stop-color="#000" stop-opacity="0"></stop><stop offset="50%" stop-color="#000" stop-opacity=".08"></stop><stop offset="85%" stop-color="#000" stop-opacity="0"></stop><stop offset="100%" stop-color="#000" stop-opacity=".28"></stop>
</linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0.2">
<stop offset="0%" stop-color="#fff" stop-opacity="0"></stop><stop offset="20%" stop-color="#fff" stop-opacity=".18"></stop><stop offset="35%" stop-color="#fff" stop-opacity="0"></stop><stop offset="55%" stop-color="#fff" stop-opacity=".22"></stop><stop offset="70%" stop-color="#fff" stop-opacity="0"></stop><stop offset="88%" stop-color="#fff" stop-opacity=".15"></stop><stop offset="100%" stop-color="#fff" stop-opacity="0"></stop>
</linearGradient>
<pattern id="silk" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
<rect width="14" height="14" fill="transparent"></rect>
<line x1="0" y1="0" x2="0" y2="14" stroke="#fff" stroke-opacity=".04" stroke-width="1"></line>
<line x1="7" y1="0" x2="7" y2="14" stroke="#000" stroke-opacity=".04" stroke-width="1"></line>
</pattern>
<filter id="dropshadow" x="-5%" y="-5%" width="110%" height="115%">
<feGaussianBlur in="SourceAlpha" stdDeviation="6"></feGaussianBlur><feOffset dx="3" dy="6"></feOffset>
<feComponentTransfer><feFuncA type="linear" slope=".35"></feFuncA></feComponentTransfer>
<feMerge><feMergeNode></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
</filter>
</defs>
