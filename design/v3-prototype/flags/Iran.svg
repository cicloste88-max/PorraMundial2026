</linearGradient>
<linearGradient id="foldsV" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#000" stop-opacity=".25"></stop><stop offset="15%" stop-color="#000" stop-opacity="0"></stop><stop offset="50%" stop-color="#000" stop-opacity=".08"></stop><stop offset="85%" stop-color="#000" stop-opacity="0"></stop><stop offset="100%" stop-color="#000" stop-opacity=".28"></stop>
