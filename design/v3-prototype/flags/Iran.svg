<pattern id="silk" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
<rect width="14" height="14" fill="transparent"></rect>
<line x1="0" y1="0" x2="0" y2="14" stroke="#fff" stroke-opacity=".04" stroke-width="1"></line>
<line x1="7" y1="0" x2="7" y2="14" stroke="#000" stroke-opacity=".04" stroke-width="1"></line>
</pattern>
<filter id="dropshadow" x="-5%" y="-5%" width="110%" height="115%">
<feGaussianBlur in="SourceAlpha" stdDeviation="6"></feGaussianBlur><feOffset dx="3" dy="6"></feOffset>
<feComponentTransfer><feFuncA type="linear" slope=".35"></feFuncA></feComponentTransfer>
<feMerge><feMergeNode></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
</filter>
</defs>
