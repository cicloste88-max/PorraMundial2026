name: Scrapling Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Scrapling
        run: |
          pip install "scrapling[fetchers]"
          scrapling install
        env:
          PYTHONUNBUFFERED: "1"

      - name: Run probe
        run: |
          python scripts/scraping/probe_scrapling.py 2>&1 | tee probe.log
        env:
          PYTHONUNBUFFERED: "1"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrapling-probe-${{ github.run_id }}
          path: |
            probe-results.json
            probe.log
          retention-days: 14
          if-no-files-found: warn
