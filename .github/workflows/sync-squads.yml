name: Sync Squads

on:
  schedule:
    # Cada 6h UTC: detecta nuevas listas FINAL vía AS+Sport+Olympics (--mode=detect)
    # + enriquece valor/edad/foto vía Transfermarkt (--mode=enrich-tm-mw) en pasada
    # serial. enrich-tm-mw (FIWC masivo A + kader fallback B) NO depende de
    # tm-ids.json y por eso enriquece selecciones con 0 tm_player_id desde cero
    # (legacy enrich-tm las saltaba con 'no-tmid' — ver PL-1). Sin --full: la fase
    # B sólo corre por país con baja cobertura, así el job entra en timeout 15m.
    # Cron de GitHub Actions puede retrasarse ~30min en horas pico (aceptable).
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de ejecución (detect = nuevo flujo por defecto)'
        type: choice
        options:
          - detect
          - scrape
          - enrich-tm        # LEGACY 1-país, mantener una semana, después borrar
          - enrich-tm-mw     # NUEVO 20-may: FIWC masivo (A) + kader fallback (B)
        default: detect
      iso3_filter:
        description: 'iso3 a procesar (vacío = todos). CSV ej "FRA,JPN"'
        type: string
        default: ''
      verbose:
        description: 'Log detallado de fetches y matches'
        type: boolean
        default: true
      enrich_xi:
        description: '[detect only] enriquecer XI titular vía FF tras detect'
        type: boolean
        default: true
      reseed_xi:
        description: '[detect only] re-marcar XI vía FF también en squads pineados (PL-3 backfill one-time)'
        type: boolean
        default: false
      build_xi:
        description: '[detect only] construir squads.xi (Pizarra XI real, A2 FIX C) tras detect'
        type: boolean
        default: false
      refresh_final:
        description: '[scrape only, LEGACY] aplicar --refresh-final'
        type: boolean
        default: false
      full:
        description: '[enrich-tm-mw] forzar fase B siempre (rellena dob+dorsal incluso en países con buena cobertura A)'
        type: boolean
        default: false
      kader_stragglers:
        description: '[enrich-tm-mw] forzar fase B (kader) si quedan jugadores sin tm_player_id tras fase A (recoge rezagados fuera de FIWC)'
        type: boolean
        default: false
      dry_run:
        description: 'Dry-run: NO aplica UPDATE a BD, solo loguea diff propuesto. Higiene operativa para validar antes de productivo.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-squads
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 30 (era 15): el cron sin --iso3 baja las 48 FF en el prefetch (~8min,
    # fetch_sources.py ProcessPool 3 workers) + install Scrapling/Playwright
    # (~2-4min) + detect + enrich-tm-mw ≈ 18-20min. El cap de 15 cancelaba el
    # job a mitad ("exceeded max execution time 15m0s") → runs fallidos en
    # serie y nada persistido desde 31-may 13:38. Dispatches con iso3_filter
    # son ligeros (FF acotado) y caben de sobra. Optimización pendiente
    # (post-launch): acotar el prefetch FF a selecciones no-final.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ─────────────────────────────────────────────────────────────────
      # Pre-fetch HTMLs via Scrapling (Python). Las IPs USA de GH Actions
      # quedan bloqueadas por Cloudflare/Akamai con node fetch() puro
      # (HTTP 403 sistemático en 4 de 5 fuentes). Scrapling usa TLS
      # fingerprint de browser real (curl_cffi + Playwright stealth) que
      # sí pasa el filtro. Output: cache/sources/<source>.html que leen
      # los parsers Node vía loadCachedHtml().
      # NO incluir cache:pip en setup-python (requiere requirements.txt
      # que no existe en este repo — ERR-XX).
      # ─────────────────────────────────────────────────────────────────
      - name: Setup Python 3.11
        # detect mode necesita pre-fetch. Los otros modes (scrape/enrich-tm/
        # enrich-tm-mw) NO usan las 5 fuentes primarias — saltar Scrapling
        # ahorra ~90s en cada run manual de esos modos.
        if: ${{ inputs.mode == '' || inputs.mode == 'detect' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Scrapling
        if: ${{ inputs.mode == '' || inputs.mode == 'detect' }}
        run: |
          pip install "scrapling[fetchers]"
          scrapling install
        env:
          PYTHONUNBUFFERED: "1"

      - name: Fetch source HTMLs via Scrapling
        # continue-on-error: un fallo parcial NO bloquea el motor Node;
        # los parsers de las fuentes fallidas throw → Promise.allSettled
        # las marca como rejected y cross-validate sigue con las demás.
        # ISO3_FILTER: propagado al pre-fetch para limitar FF_COUNTRIES en
        # dispatches acotados (las 5 primarias son índices HTML — siempre se
        # fetchean enteras). Sin esto el run 26549858215 (4 países pedidos)
        # excedió 15m fetcheando los 48 FF.
        if: ${{ inputs.mode == '' || inputs.mode == 'detect' }}
        continue-on-error: true
        run: python scripts/scraping/fetch_sources.py
        env:
          PYTHONUNBUFFERED: "1"
          ISO3_FILTER: ${{ inputs.iso3_filter }}

      - name: Write .env from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
          } > .env

      - name: Build CLI flags
        id: flags
        env:
          MODE: ${{ inputs.mode }}
          ISO3_FILTER: ${{ inputs.iso3_filter }}
          VERBOSE: ${{ inputs.verbose }}
          ENRICH_XI: ${{ inputs.enrich_xi }}
          RESEED_XI: ${{ inputs.reseed_xi }}
          BUILD_XI: ${{ inputs.build_xi }}
          REFRESH_FINAL: ${{ inputs.refresh_final }}
          FULL: ${{ inputs.full }}
          KADER_STRAGGLERS: ${{ inputs.kader_stragglers }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # En schedule los inputs llegan vacíos; ${VAR:-default} aplica el default
          # solo cuando está unset/empty, preservando "false" explícito de UI.
          MODE="${MODE:-detect}"
          ISO3_FILTER="${ISO3_FILTER:-}"
          VERBOSE="${VERBOSE:-true}"
          ENRICH_XI="${ENRICH_XI:-true}"
          RESEED_XI="${RESEED_XI:-false}"
          BUILD_XI="${BUILD_XI:-false}"
          REFRESH_FINAL="${REFRESH_FINAL:-false}"
          FULL="${FULL:-false}"
          KADER_STRAGGLERS="${KADER_STRAGGLERS:-false}"
          DRY_RUN="${DRY_RUN:-false}"

          # Sanity check del input libre.
          if [ -n "${ISO3_FILTER}" ] && ! printf '%s' "${ISO3_FILTER}" | grep -qE '^[A-Z]{3}(,[A-Z]{3})*$'; then
            echo "ERROR: iso3_filter debe ser código de 3 letras MAYUS, opcionalmente coma-separado (e.g. FRA, FRA,JPN)"
            exit 1
          fi

          DETECT_FLAGS="--mode=detect"
          SCRAPE_FLAGS="--mode=scrape"
          TM_FLAGS="--mode=enrich-tm"
          TMMW_FLAGS="--mode=enrich-tm-mw"

          if [ -n "${ISO3_FILTER}" ]; then
            DETECT_FLAGS="${DETECT_FLAGS} --iso3=${ISO3_FILTER}"
            SCRAPE_FLAGS="${SCRAPE_FLAGS} --iso3=${ISO3_FILTER}"
            TM_FLAGS="${TM_FLAGS} --iso3=${ISO3_FILTER}"
            TMMW_FLAGS="${TMMW_FLAGS} --iso3=${ISO3_FILTER}"
          else
            TM_FLAGS="${TM_FLAGS} --all"
          fi

          if [ "${ENRICH_XI}" != "true" ]; then
            DETECT_FLAGS="${DETECT_FLAGS} --no-enrich-xi"
          fi
          if [ "${RESEED_XI}" = "true" ]; then
            DETECT_FLAGS="${DETECT_FLAGS} --reseed-xi"
          fi
          if [ "${BUILD_XI}" = "true" ]; then
            DETECT_FLAGS="${DETECT_FLAGS} --build-xi"
          fi
          if [ "${REFRESH_FINAL}" = "true" ]; then
            SCRAPE_FLAGS="${SCRAPE_FLAGS} --refresh-final"
          elif [ -z "${ISO3_FILTER}" ]; then
            SCRAPE_FLAGS="${SCRAPE_FLAGS} --all-missing"
          fi
          if [ "${FULL}" = "true" ]; then
            TMMW_FLAGS="${TMMW_FLAGS} --full"
          fi
          if [ "${KADER_STRAGGLERS}" = "true" ]; then
            TMMW_FLAGS="${TMMW_FLAGS} --kader-stragglers"
          fi
          if [ "${VERBOSE}" = "true" ]; then
            DETECT_FLAGS="${DETECT_FLAGS} --verbose"
            SCRAPE_FLAGS="${SCRAPE_FLAGS} --verbose"
            TM_FLAGS="${TM_FLAGS} --verbose"
            TMMW_FLAGS="${TMMW_FLAGS} --verbose"
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            DETECT_FLAGS="${DETECT_FLAGS} --dry-run"
            SCRAPE_FLAGS="${SCRAPE_FLAGS} --dry-run"
            TM_FLAGS="${TM_FLAGS} --dry-run"
            TMMW_FLAGS="${TMMW_FLAGS} --dry-run"
          fi

          {
            echo "mode=${MODE}"
            echo "detect=${DETECT_FLAGS}"
            echo "scrape=${SCRAPE_FLAGS}"
            echo "tm=${TM_FLAGS}"
            echo "tmmw=${TMMW_FLAGS}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved mode: ${MODE}"
          echo "  detect flags: ${DETECT_FLAGS}"
          echo "  scrape flags: ${SCRAPE_FLAGS}"
          echo "  tm flags:     ${TM_FLAGS}"
          echo "  tm-mw flags:  ${TMMW_FLAGS}"

      # Step principal del cron: detect primero, enrich-tm-mw a continuación.
      # En workflow_dispatch con mode != detect, el primer step se salta.
      - name: Run detect (primary sources)
        if: ${{ steps.flags.outputs.mode == 'detect' }}
        run: npm run sync-squads -- ${{ steps.flags.outputs.detect }} 2>&1 | tee -a sync-squads.log

      - name: Run scrape [legacy]
        if: ${{ steps.flags.outputs.mode == 'scrape' }}
        run: npm run sync-squads -- ${{ steps.flags.outputs.scrape }} 2>&1 | tee -a sync-squads.log

      - name: Run enrich-tm [legacy, manual only]
        # LEGACY: ID-first sobre tm-ids.json — salta selecciones sin tm_id con
        # 'no-tmid' (PL-1). Ya NO corre en el cron; sólo en dispatch manual
        # explícito mode=enrich-tm. Candidato a borrar tras validar enrich-tm-mw.
        if: ${{ steps.flags.outputs.mode == 'enrich-tm' }}
        run: npm run sync-squads -- ${{ steps.flags.outputs.tm }} 2>&1 | tee -a sync-squads.log

      - name: Run enrich-tm-mw
        # Cron: corre tras detect (paso de enriquecimiento por defecto desde PL-1).
        # Manual mode=enrich-tm-mw: corre directamente.
        if: ${{ steps.flags.outputs.mode == 'detect' || steps.flags.outputs.mode == 'enrich-tm-mw' }}
        run: npm run sync-squads -- ${{ steps.flags.outputs.tmmw }} 2>&1 | tee -a sync-squads.log

      - name: Upload log + calendar artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-squads-log-${{ github.run_id }}
          path: |
            sync-squads.log
            cache/squads-calendar.json
            cache/sources/fetch-summary.json
            cache/sources/ff-*.html
          retention-days: 14
          if-no-files-found: warn
